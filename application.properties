# --- 1. NEXUS AI / GROQ CONFIGURATION ---
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# --- 2. POSTGRES DATABASE CONFIGURATION ---
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_db
spring.datasource.username=postgres
spring.datasource.password=Sreyas@123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- 3. HIBERNATE & JPA SETTINGS ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- 4. SECURITY & SESSION CONSTRAINTS (NEW) ---
# Prevents sessions from lasting forever (Standard is 30 mins)
server.servlet.session.timeout=30m
# Ensures cookies are only sent over secure channels in production
server.servlet.session.cookie.http-only=true

# --- 5. DATA VALIDATION & ERROR HANDLING (NEW) ---
# This ensures that validation error messages from @NotBlank etc.
# are correctly passed to your GlobalExceptionHandler
server.error.include-message=always
server.error.include-binding-errors=always

# --- 6. HIKARI CONNECTION POOLING (NEW) ---
# Performance boost: reuse database connections instead of opening new ones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# --- 7. JSON RECURSION PREVENTION ---
spring.jackson.serialization.fail-on-empty-beans=false
