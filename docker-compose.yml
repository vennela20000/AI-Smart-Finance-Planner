services:
  nexus-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user123
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nexus_db
    ports:
      - "5432:5432"

  nexus-app:
    build: .        # This tells Docker to look for the 'Dockerfile'
    ports:
      - "8080:8080"
    depends_on:
      - nexus-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nexus-db:5432/nexus_db
      SPRING_DATASOURCE_USERNAME: user123
      SPRING_DATASOURCE_PASSWORD: password123